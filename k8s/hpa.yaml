apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: salescast-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: salescast-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Scale up quickly, down slowly: forecast traffic is bursty and repeatedly
    # cycling pods costs more than running one spare.
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
